version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: astrologer_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
      - client
    networks:
      - astrologer_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: astrologer_server
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/astrologer_prod
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - astrologer_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: astrologer_client
    restart: always
    networks:
      - astrologer_net

  mongodb:
    image: mongo:7.0
    container_name: astrologer_mongodb
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - astrologer_net
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: astrologer_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - astrologer_net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  astrologer_net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
