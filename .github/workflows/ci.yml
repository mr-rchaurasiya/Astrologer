name: Astrologer CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test_and_build:
    name: Test & Build Full Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: Run Backend Vitest Suite
        run: npm --prefix server run test -- --run

      - name: Compile Backend TypeScript
        run: npm --prefix server run build

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Run Frontend Vitest Suite
        run: npm --prefix client run test -- --run

      - name: Compile Frontend Vite Bundle
        run: npm --prefix client run build

      - name: Secret Leak Audit on Client Bundle
        run: |
          echo "Scanning client dist directory for accidentally bundled server secrets..."
          ! grep -rnE "(AI_API_KEY|RAZORPAY_KEY_SECRET|JWT_ACCESS_SECRET|JWT_REFRESH_SECRET|MONGODB_URI|SMTP_PASSWORD)" client/dist/
