name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy_staging:
    name: Staging Deployment
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        run: |
          npm --prefix server ci && npm --prefix server run build
          npm --prefix client ci && npm --prefix client run build

      - name: Deploy Container to Staging Cluster
        run: |
          echo "Deploying to Staging Environment..."
          # Deploy steps (e.g. AWS ECS / Cloud Run / Kubernetes / SSH Docker Compose)
